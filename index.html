<!DOCTYPE html>
<html lang="uk" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Розклад пар</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root[data-theme="dark"] {
      --bg: #000000;
      --card-bg: rgba(28, 28, 30, 0.72);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #FFFFFF;
      --text-sub: #8E8E93;
      --accent: #0A84FF;
      --green: #30D158;
      --orange: #FF9F0A;
      --segment-bg: rgba(118, 118, 128, 0.24);
      --segment-active: #636366;
    }

    :root[data-theme="light"] {
      --bg: #F2F2F7;
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(0, 0, 0, 0.06);
      --text-main: #000000;
      --text-sub: #6C6C70;
      --accent: #007AFF;
      --green: #34C759;
      --orange: #FF9500;
      --segment-bg: rgba(118, 118, 128, 0.15);
      --segment-active: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding: 16px;
      padding-bottom: 50px;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Верхняя панель */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-top: 6px;
    }
    .header-sub {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
      color: var(--text-sub);
    }
    .header-title {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .theme-toggle-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-size: 19px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transition: transform 0.15s ease;
    }
    .theme-toggle-btn:active {
      transform: scale(0.88);
    }

    /* Переключатель дней недели (iOS Segmented Control) */
    .days-scroll {
      display: flex;
      gap: 6px;
      background: var(--segment-bg);
      padding: 4px;
      border-radius: 14px;
      margin-bottom: 18px;
    }
    .day-chip {
      flex: 1;
      text-align: center;
      padding: 9px 2px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 10px;
      color: var(--text-sub);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .day-chip.active {
      background: var(--segment-active);
      color: var(--text-main);
      box-shadow: 0 3px 10px rgba(0,0,0,0.15);
      transform: scale(1.02);
    }

    /* Карточки Apple Card */
    .ios-card {
      background: var(--card-bg);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Статус текущей пары */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      color: var(--green);
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--green);
      border-radius: 50%;
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 0 0 rgba(48, 209, 88, 0.6); }
      50% { opacity: 0.7; transform: scale(1.15); box-shadow: 0 0 0 5px rgba(48, 209, 88, 0); }
    }

    .current-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .current-meta {
      font-size: 13px;
      color: var(--text-sub);
      margin-bottom: 14px;
    }

    /* Прогресс-бар */
    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: var(--segment-bg);
      border-radius: 6px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 6px;
      transition: width 0.5s ease;
    }

    /* Список пар */
    .section-title {
      font-size: 18px;
      font-weight: 600;
      margin: 18px 0 10px 4px;
    }

    .pair-row {
      display: flex;
      align-items: center;
      padding: 12px 6px;
      border-radius: 12px;
      transition: background 0.15s ease, transform 0.1s ease;
      cursor: pointer;
    }
    .pair-row:active {
      transform: scale(0.98);
      background: var(--segment-bg);
    }
    .pair-time {
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      min-width: 90px;
    }
    .pair-info {
      flex: 1;
      padding-left: 10px;
    }
    .pair-name {
      font-size: 15px;
      font-weight: 500;
    }
    .pair-teacher {
      font-size: 12px;
      color: var(--text-sub);
      margin-top: 2px;
    }

    /* Индикатор перемен */
    .break-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: rgba(255, 159, 10, 0.12);
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 12px;
      color: var(--orange);
      font-weight: 600;
      margin: 6px 0;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div>
      <div class="header-sub">СЬОГОДНІ</div>
      <div class="header-title">Розклад</div>
    </div>
    <button class="theme-toggle-btn" id="themeBtn" onclick="toggleTheme()">🌙</button>
  </div>

  <!-- Табы дней недели -->
  <div class="days-scroll" id="daysScroll">
    <div class="day-chip" onclick="selectDay(0)">Пн</div>
    <div class="day-chip" onclick="selectDay(1)">Вт</div>
    <div class="day-chip" onclick="selectDay(2)">Ср</div>
    <div class="day-chip" onclick="selectDay(3)">Чт</div>
    <div class="day-chip" onclick="selectDay(4)">Пт</div>
    <div class="day-chip" onclick="selectDay(5)">Сб</div>
  </div>

  <!-- Виджет текущей/следующей пары -->
  <div class="ios-card">
    <div class="status-badge">
      <div class="status-dot"></div>
      <span id="liveStatus">Завантаження...</span>
    </div>
    <div class="current-title" id="livePairName">—</div>
    <div class="current-meta" id="livePairMeta">—</div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="pairProgress"></div>
    </div>
  </div>

  <div class="section-title">Розклад занять</div>

  <!-- Список пар выбранного дня -->
  <div class="ios-card" id="scheduleListContainer"></div>

  <!-- Подключение JS с параметром сброса кэша браузера -->
  <script src="app.js?v=3"></script>

<!-- Карточка управления чатом -->
<div class="ios-card" style="text-align: center;">
  <div style="font-size: 14px; color: var(--text-sub); margin-bottom: 12px;">
    Отримуй нагадування за 5 хвилин до пари прямо в чаті
  </div>
  <button onclick="closeToChat()" style="
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 10px 20px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
  ">
    💬 Перейти до бота / Налаштувати сповіщення
  </button>
</div>  
  
</body>
</html>
