<!DOCTYPE html>
<html lang="uk" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Розклад пар • КМ 24-9-1</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* Базові змінні для світлої теми */
    :root, body, body.theme-light {
      --bg: #F2F2F7;
      --bg-secondary: #FFFFFF;
      --card-bg: rgba(255, 255, 255, 0.88);
      --card-solid: #FFFFFF;
      --card-border: rgba(0, 0, 0, 0.08);
      --text-primary: #000000;
      --text-secondary: #6E6E73;
      --text-tertiary: #AEAEB2;
      --accent-blue: #007AFF;
      --accent-green: #34C759;
      --accent-orange: #FF9500;
      --accent-purple: #AF52DE;
      --accent-red: #FF3B30;
      --segmented-bg: rgba(118, 118, 128, 0.15);
      --blur: blur(28px);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 6px 20px rgba(0, 0, 0, 0.08);
      --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", sans-serif;
    }

    /* Змінні для темної теми */
    body.theme-dark, [data-theme="dark"] {
      --bg: #000000 !important;
      --bg-secondary: #1C1C1E !important;
      --card-bg: rgba(28, 28, 30, 0.88) !important;
      --card-solid: #1C1C1E !important;
      --card-border: rgba(255, 255, 255, 0.12) !important;
      --text-primary: #FFFFFF !important;
      --text-secondary: #98989D !important;
      --text-tertiary: #48484A !important;
      --segmented-bg: rgba(118, 118, 128, 0.3) !important;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.4) !important;
      --shadow-md: 0 6px 24px rgba(0, 0, 0, 0.55) !important;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
    }

    body {
      background-color: var(--bg) !important;
      color: var(--text-primary) !important;
      padding: 16px;
      padding-top: calc(env(safe-area-inset-top, 16px) + 10px);
      padding-bottom: calc(env(safe-area-inset-bottom, 20px) + 40px);
      min-height: 100vh;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    /* Верхня панель з тегом коледжу та перемикачем тем */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .college-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.4px;
      color: var(--accent-blue);
      background: rgba(0, 122, 255, 0.12);
      padding: 6px 12px;
      border-radius: 14px;
    }

    /* Перемикач тем у стилі Apple Control Center */
    .theme-capsule {
      display: flex;
      background: var(--segmented-bg);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border-radius: 20px;
      padding: 3px;
      gap: 3px;
      border: 1px solid var(--card-border);
    }
    .theme-btn {
      border: none;
      background: transparent;
      padding: 6px 10px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 16px;
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .theme-btn.active {
      background: var(--card-solid);
      color: var(--text-primary);
      box-shadow: var(--shadow-sm);
    }

    /* Заголовки */
    .group-title {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.8px;
      line-height: 1.1;
      margin-bottom: 4px;
    }
    .date-subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      font-weight: 500;
      margin-bottom: 16px;
    }

    /* Інтерактивний Apple Live-віджет */
    .summary-widget {
      background: var(--card-bg);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      padding: 16px 18px;
      margin-bottom: 18px;
      box-shadow: var(--shadow-md);
      position: relative;
    }
    .widget-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .widget-stat-group {
      display: flex;
      gap: 18px;
    }
    .stat-item {
      display: flex;
      flex-direction: column;
    }
    .stat-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--text-secondary);
    }
    .stat-value {
      font-size: 17px;
      font-weight: 700;
      margin-top: 2px;
    }
    .live-indicator {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(52, 199, 89, 0.16);
      color: var(--accent-green);
      font-size: 12px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 20px;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-green);
      animation: pulse 1.6s infinite ease-in-out;
    }
    @keyframes pulse {
      0% { transform: scale(0.85); opacity: 0.7; }
      50% { transform: scale(1.4); opacity: 1; }
      100% { transform: scale(0.85); opacity: 0.7; }
    }

    .countdown-banner {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }
    .countdown-timer {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      color: var(--accent-blue);
      font-size: 15px;
    }

    /* Пошуковий рядок Spotlight */
    .search-wrapper {
      position: relative;
      margin-bottom: 16px;
    }
    .search-input {
      width: 100%;
      padding: 11px 14px 11px 38px;
      background: var(--segmented-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      font-size: 15px;
      color: var(--text-primary);
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      background: var(--card-solid);
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.15);
    }
    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      color: var(--text-secondary);
      pointer-events: none;
    }
    .clear-search {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      color: var(--text-secondary);
      cursor: pointer;
      display: none;
      padding: 4px;
    }

    /* iOS Segmented Control */
    .segmented-scroll {
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      margin: 0 -16px 18px -16px;
      padding: 0 16px;
    }
    .segmented-scroll::-webkit-scrollbar {
      display: none;
    }
    .segmented-control {
      display: flex;
      background: var(--segmented-bg);
      border-radius: 13px;
      padding: 3px;
      gap: 3px;
      min-width: 420px;
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
    }
    .segmented-btn {
      flex: 1;
      padding: 9px 12px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      background: transparent;
      color: var(--text-primary);
      border-radius: 10px;
      cursor: pointer;
      white-space: nowrap;
      text-align: center;
      transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .segmented-btn.active {
      background: var(--card-solid);
      box-shadow: var(--shadow-sm);
      color: var(--text-primary);
    }

    /* Інтерактивні картки пар */
    .apple-card {
      background: var(--card-bg);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
      position: relative;
      cursor: pointer;
      transition: transform 0.16s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .apple-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    .apple-card:active {
      transform: scale(0.985);
    }
    .apple-card.live-card {
      border: 1.5px solid rgba(52, 199, 89, 0.65);
      box-shadow: 0 8px 30px rgba(52, 199, 89, 0.18);
    }
    .apple-card.past-card {
      opacity: 0.65;
    }

    .pair-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .pair-time {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--accent-blue);
      letter-spacing: -0.2px;
    }
    .pair-tag {
      font-size: 11px;
      color: var(--text-secondary);
      font-weight: 700;
      background: rgba(118, 118, 128, 0.14);
      padding: 3px 8px;
      border-radius: 8px;
      text-transform: uppercase;
    }
    .pair-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.4px;
      line-height: 1.25;
      margin-bottom: 10px;
    }
    .pair-details {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 13.5px;
      color: var(--text-secondary);
    }
    .detail-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .icon-symbol {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      background: rgba(118, 118, 128, 0.12);
      border-radius: 7px;
      font-size: 12px;
    }

    .memo-indicator {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--accent-orange);
      background: rgba(255, 149, 0, 0.14);
      padding: 4px 10px;
      border-radius: 9px;
      margin-top: 10px;
    }

    /* Прогрес-бар поточної пари */
    .progress-wrapper {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--card-border);
    }
    .progress-bar-bg {
      background: rgba(120, 120, 128, 0.18);
      border-radius: 8px;
      height: 7px;
      overflow: hidden;
    }
    .progress-bar-fill {
      background: linear-gradient(90deg, #34C759, #30D158);
      height: 100%;
      border-radius: 8px;
      transition: width 0.5s ease;
    }
    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--accent-green);
      font-weight: 600;
      margin-top: 6px;
    }

    /* Apple Bottom Sheet (Модалка деталей і нотаток) */
    .sheet-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .sheet-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .bottom-sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--card-solid);
      border-top: 1px solid var(--card-border);
      border-radius: 28px 28px 0 0;
      padding: 20px 20px calc(env(safe-area-inset-bottom, 20px) + 24px) 20px;
      z-index: 1000;
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.18, 0.89, 0.32, 1);
      box-shadow: 0 -10px 40px rgba(0,0,0,0.25);
      max-height: 85vh;
      overflow-y: auto;
    }
    .bottom-sheet.active {
      transform: translateY(0);
    }
    .sheet-handle {
      width: 38px;
      height: 5px;
      background: var(--text-tertiary);
      border-radius: 4px;
      margin: 0 auto 16px auto;
    }
    .sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 14px;
    }
    .sheet-title {
      font-size: 22px;
      font-weight: 800;
      line-height: 1.2;
    }
    .sheet-close-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--segmented-bg);
      border: none;
      color: var(--text-secondary);
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .sheet-memo-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
      margin: 18px 0 8px 0;
    }
    .sheet-textarea {
      width: 100%;
      height: 85px;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid var(--card-border);
      background: var(--bg);
      color: var(--text-primary);
      font-size: 14px;
      resize: none;
      outline: none;
    }
    .sheet-textarea:focus {
      border-color: var(--accent-blue);
    }
    .sheet-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }
    .sheet-btn {
      flex: 1;
      padding: 12px 0;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border: none;
    }
    .sheet-btn-primary {
      background: var(--accent-blue);
      color: #FFFFFF;
    }
    .sheet-btn-secondary {
      background: var(--segmented-bg);
      color: var(--text-primary);
    }

    /* Toast сповіщення */
    .toast {
      position: fixed;
      top: calc(env(safe-area-inset-top, 16px) + 20px);
      left: 50%;
      transform: translateX(-50%) translateY(-60px);
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: var(--blur);
      color: #FFFFFF;
      padding: 10px 18px;
      border-radius: 24px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 8px 25px rgba(0,0,0,0.25);
      z-index: 1001;
      transition: transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1), opacity 0.3s ease;
      opacity: 0;
      pointer-events: none;
    }
    .toast.active {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .day-section-title {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.3px;
      margin: 22px 0 10px 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .bell-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 13px 0;
      border-bottom: 1px solid var(--card-border);
    }
    .bell-item:last-child {
      border-bottom: none;
    }

    .empty-card {
      text-align: center;
      padding: 40px 20px;
    }
    .empty-icon {
      font-size: 40px;
      margin-bottom: 10px;
    }
    .empty-title {
      font-size: 18px;
      font-weight: 700;
    }
    .empty-desc {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 4px;
    }
  </style>
</head>
<body class="theme-light">
  <div class="toast" id="toast">Повідомлення</div>

  <!-- Верхня панель -->
  <div class="top-bar">
    <div class="college-tag">
      <span>🏛️</span> ВСП ФК КрНУ
    </div>
    <!-- Перемикач тем Apple -->
    <div class="theme-capsule">
      <button class="theme-btn active" id="theme-light" onclick="setTheme('light')">☀️ Світла</button>
      <button class="theme-btn" id="theme-auto" onclick="setTheme('auto')">Auto</button>
      <button class="theme-btn" id="theme-dark" onclick="setTheme('dark')">🌙 Темна</button>
    </div>
  </div>

  <!-- Заголовок -->
  <div class="group-title">КМ 24-9-1</div>
  <div class="date-subtitle" id="subtitle">Завантаження...</div>

  <!-- Apple Live Widget -->
  <div class="summary-widget">
    <div class="widget-row">
      <div class="widget-stat-group">
        <div class="stat-item">
          <span class="stat-label">Сьогодні пар</span>
          <span class="stat-value" id="today-pairs-count">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Тиждень</span>
          <span class="stat-value" id="current-week-stat">1 тижд.</span>
        </div>
      </div>
      <div id="live-status-pill">
        <span class="live-indicator"><span class="pulse-dot"></span>Розклад активний</span>
      </div>
    </div>
    <div class="countdown-banner" id="countdown-banner" style="display: flex;">
      <span id="countdown-label">Статус:</span>
      <span class="countdown-timer" id="countdown-timer">00:00</span>
    </div>
  </div>

  <!-- Пошук Spotlight -->
  <div class="search-wrapper">
    <span class="search-icon">🔍</span>
    <input type="text" class="search-input" id="search-input" placeholder="Пошук за назвою, викладачем, аудиторією..." oninput="handleSearch()" />
    <span class="clear-search" id="clear-search" onclick="clearSearch()">✕</span>
  </div>

  <!-- iOS Segmented Control -->
  <div class="segmented-scroll">
    <div class="segmented-control">
      <button class="segmented-btn active" onclick="switchTab('today', this)">Сьогодні</button>
      <button class="segmented-btn" onclick="switchTab('tomorrow', this)">Завтра</button>
      <button class="segmented-btn" onclick="switchTab('week1', this)">1 тиждень</button>
      <button class="segmented-btn" onclick="switchTab('week2', this)">2 тиждень</button>
      <button class="segmented-btn" onclick="switchTab('bells', this)">Дзвінки</button>
    </div>
  </div>

  <!-- Список пар -->
  <div id="container"></div>

  <!-- Apple Bottom Sheet для нотаток і копіювання -->
  <div class="sheet-overlay" id="sheet-overlay" onclick="closeSheet()"></div>
  <div class="bottom-sheet" id="bottom-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div>
        <div class="pair-tag" id="sheet-pair-tag" style="margin-bottom: 6px;">Пара #1</div>
        <div class="sheet-title" id="sheet-title">Предмет</div>
      </div>
      <button class="sheet-close-btn" onclick="closeSheet()">✕</button>
    </div>

    <div class="pair-details" style="font-size: 14px; margin-bottom: 14px;">
      <div class="detail-item">
        <span class="icon-symbol">⏰</span>
        <span id="sheet-time" style="font-weight: 700; color: var(--accent-blue);">08:30 – 10:00</span>
      </div>
      <div class="detail-item">
        <span class="icon-symbol">🚪</span>
        <span id="sheet-room">Аудиторія</span>
      </div>
      <div class="detail-item">
        <span class="icon-symbol">👨‍🏫</span>
        <span id="sheet-teacher">Викладач</span>
      </div>
    </div>

    <div class="sheet-memo-title">📝 Мої нотатки та завдання</div>
    <textarea class="sheet-textarea" id="sheet-memo" placeholder="Наприклад: підготувати звіт, здати лабораторну, тест..."></textarea>

    <div class="sheet-actions">
      <button class="sheet-btn sheet-btn-secondary" onclick="copyPairInfo()">📋 Скопіювати</button>
      <button class="sheet-btn sheet-btn-primary" onclick="saveMemo()">💾 Зберегти нотатку</button>
    </div>
  </div>

  <script>
    // --- ДАНІ РОЗКЛАДУ ГРУПИ КМ 24-9-1 ---
    const BELLS = [
      { pair: 1, start: "08:30", end: "10:00", breakTime: "15 хв" },
      { pair: 2, start: "10:15", end: "11:45", breakTime: "30 хв (велика перерва)" },
      { pair: 3, start: "12:15", end: "13:45", breakTime: "15 хв" },
      { pair: 4, start: "14:00", end: "15:30", breakTime: "Кінець занять" },
    ];

    const DAYS_NAMES = [
      "Понеділок", "Вівторок", "Середа",
      "Четвер", "П'ятниця", "Субота", "Неділя"
    ];

    const SCHEDULE = {
      0: [ // Понеділок
        { pair: 1, name: "Комп'ютерна схемотехніка і електроніка", teacher: "Габузян Г.В.", room: "Ауд. 301", type: "Лекція/Практика", week: null },
        { pair: 3, name: "Комп'ютерна схемотехніка і електроніка", teacher: "Габузян Г.В.", room: "Ауд. 301", type: "Лекція/Практика", week: null },
        { pair: 4, name: "Програмна інженерія", teacher: "Мілашенко А.М.", room: "Лаб. 12", type: "Практика", week: null }
      ],
      1: [ // Вівторок
        { pair: 1, name: "Програмна інженерія", teacher: "Мілашенко А.М.", room: "Лаб. 12", type: "Практика", week: null },
        { pair: 2, name: "Методи та системи штучного інтелекту", teacher: "Мілашенко А.М.", room: "Лаб. 12", type: "Лекція", week: null },
        { pair: 3, name: "Комп'ютерні системи", teacher: "Мурчкова М.М.", room: "Ауд. 204", type: "Лекція", week: null },

        { pair: 1, name: "Українська мова за ПС", teacher: "Петрухненко В.В.", room: "Ауд. 410", type: "Практика", week: 2 },

        { pair: 4, name: "Комп'ютерна схемотехніка і електроніка", teacher: "Габузян Г.В.", room: "Ауд. 301", type: "Практика", week: 1 }
      ],

    // --- БЕЗПЕЧНА РОБОТА З ПАМ'ЯТТЮ ТА HAPTICS ---
    function safeGet(key, def = null) {
      try { return localStorage.getItem(key) || def; } catch (e) { return def; }
    }
    function safeSet(key, val) {
      try { localStorage.setItem(key, val); } catch (e) {}
    }
    function safeRemove(key) {
      try { localStorage.removeItem(key); } catch (e) {}
    }

    const tg = window.Telegram?.WebApp;
    if (tg) {
      try { tg.expand(); tg.ready(); } catch(e) {}
    }

    function haptic(style = 'light') {
      try {
        if (tg?.HapticFeedback) {
          if (style === 'selection') tg.HapticFeedback.selectionChanged();
          else if (style === 'success' || style === 'error' || style === 'warning') tg.HapticFeedback.notificationOccurred(style);
          else tg.HapticFeedback.impactOccurred(style);
        }
      } catch (e) {}
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.classList.add('active');
      setTimeout(() => t.classList.remove('active'), 2200);
    }

    // --- ПЕРЕМИКАННЯ ТЕМ (APPLE CONTROL CENTER) ---
    function setTheme(mode) {
      haptic('selection');
      safeSet('km_theme', mode);

      document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById(`theme-${mode}`);
      if (activeBtn) activeBtn.classList.add('active');

      let isDark = false;
      if (mode === 'auto') {
        if (tg?.colorScheme) {
          isDark = (tg.colorScheme === 'dark');
        } else if (window.matchMedia) {
          isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        }
      } else {
        isDark = (mode === 'dark');
      }

      if (isDark) {
        document.body.classList.remove('theme-light');
        document.body.classList.add('theme-dark');
        document.documentElement.setAttribute('data-theme', 'dark');
      } else {
        document.body.classList.remove('theme-dark');
        document.body.classList.add('theme-light');
        document.documentElement.setAttribute('data-theme', 'light');
      }
    }

    // --- РОЗРАХУНОК ТИЖНЯ ТА ДНЯ ---
    function getWeekNumber(d) {
      d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
      d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
      const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
      return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    }

    function getWeekType(date = new Date()) {
      const weekNum = getWeekNumber(date);
      return (weekNum % 2 !== 0) ? 1 : 2;
    }

    function getDayIndex(date) {
      const jsDay = date.getDay(); // 0 = Неділя, 1 = Понеділок...
      return jsDay === 0 ? 6 : jsDay - 1; // 0 = Понеділок, 6 = Неділя
    }

    function timeToMinutes(timeStr) {
      const [h, m] = timeStr.split(':').map(Number);
      return h * 60 + m;
    }

    let currentTab = 'today';
    let searchQuery = '';
    let selectedPairForModal = null;

    function switchTab(tab, btn) {
      document.querySelectorAll('.segmented-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentTab = tab;
      haptic('light');
      render();
    }

    function handleSearch() {
      searchQuery = document.getElementById('search-input').value.trim().toLowerCase();
      document.getElementById('clear-search').style.display = searchQuery ? 'block' : 'none';
      render();
    }

    function clearSearch() {
      document.getElementById('search-input').value = '';
      searchQuery = '';
      document.getElementById('clear-search').style.display = 'none';
      render();
    }

    // --- ГОЛОВНИЙ РЕНДЕР ---
    function render() {
      try {
        const now = new Date();
        const currentWeek = getWeekType(now);
        const weekLabel = currentWeek === 1 ? 'Чисельник (1 тиждень)' : 'Знаменник (2 тиждень)';

        updateSummaryWidget(now, currentWeek);

        if (currentTab === 'today') {
          renderDay(0, currentWeek, 'Сьогодні', weekLabel);
        } else if (currentTab === 'tomorrow') {
          const tomorrow = new Date(now);
          tomorrow.setDate(tomorrow.getDate() + 1);
          const tomWeek = getWeekType(tomorrow);
          const tomWeekLabel = tomWeek === 1 ? 'Чисельник (1 тиждень)' : 'Знаменник (2 тиждень)';
          renderDay(1, tomWeek, 'Завтра', tomWeekLabel);
        } else if (currentTab === 'week1') {
          renderFullWeek(1, '1 тиждень (Чисельник)');
        } else if (currentTab === 'week2') {
          renderFullWeek(2, '2 тиждень (Знаменник)');
        } else if (currentTab === 'bells') {
          renderBells();
        }
      } catch (err) {
        console.error('Render error:', err);
      }
    }

    function updateSummaryWidget(now, currentWeek) {
      document.getElementById('current-week-stat').innerText = `${currentWeek} тижд. (${currentWeek === 1 ? 'Чис.' : 'Знам.'})`;

      const dayIdx = getDayIndex(now);
      const todayPairs = (SCHEDULE[dayIdx] || []).filter(p => p.week === null || p.week === currentWeek);
      document.getElementById('today-pairs-count').innerText = todayPairs.length;

      const nowMin = now.getHours() * 60 + now.getMinutes();
      const nowSec = now.getSeconds();

      let activePair = null;
      let nextPair = null;

      todayPairs.forEach(p => {
        const bell = BELLS.find(b => b.pair === p.pair);
        if (!bell) return;
        const s = timeToMinutes(bell.start);
        const e = timeToMinutes(bell.end);

        if (nowMin >= s && nowMin <= e) {
          activePair = { ...p, start: bell.start, end: bell.end, startMin: s, endMin: e };
        } else if (nowMin < s && (!nextPair || s < nextPair.startMin)) {
          nextPair = { ...p, start: bell.start, end: bell.end, startMin: s };
        }
      });

      const pill = document.getElementById('live-status-pill');
      const banner = document.getElementById('countdown-banner');
      const label = document.getElementById('countdown-label');
      const timer = document.getElementById('countdown-timer');

      if (activePair) {
        pill.innerHTML = `<span class="live-indicator"><span class="pulse-dot"></span>Йде #${activePair.pair} пара</span>`;
        banner.style.display = 'flex';
        label.innerText = `До кінця ${activePair.pair}-ї пари:`;
        const totalSecLeft = (activePair.endMin * 60) - (now.getHours() * 3600 + now.getMinutes() * 60 + nowSec);
        const m = Math.max(0, Math.floor(totalSecLeft / 60));
        const s = Math.max(0, totalSecLeft % 60);
        timer.innerText = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      } else if (nextPair) {
        pill.innerHTML = `<span style="font-size:12px; font-weight:700; color:var(--accent-orange); background:rgba(255,149,0,0.16); padding:5px 12px; border-radius:20px;">Перерва</span>`;
        banner.style.display = 'flex';
        label.innerText = `До початку #${nextPair.pair} пари:`;
        const totalSecLeft = (nextPair.startMin * 60) - (now.getHours() * 3600 + now.getMinutes() * 60 + nowSec);
        const m = Math.max(0, Math.floor(totalSecLeft / 60));
        const s = Math.max(0, totalSecLeft % 60);
        timer.innerText = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      } else {
        pill.innerHTML = `<span style="font-size:12px; font-weight:700; color:var(--text-secondary); background:var(--segmented-bg); padding:5px 12px; border-radius:20px;">Пар немає</span>`;
        banner.style.display = 'flex';
        label.innerText = `Навчальний день:`;
        timer.innerText = `Завершено ✨`;
      }
    }

    function renderDay(dayOffset, weekType, label, weekLabel) {
      const targetDate = new Date();
      targetDate.setDate(targetDate.getDate() + dayOffset);
      const dayIdx = getDayIndex(targetDate);
      const dayName = DAYS_NAMES[dayIdx];
      const dateStr = targetDate.toLocaleDateString('uk-UA', { day: 'numeric', month: 'long' });

      document.getElementById('subtitle').innerText = `${label} • ${dayName}, ${dateStr} • ${weekLabel}`;

      let pairs = (SCHEDULE[dayIdx] || [])
        .filter(p => p.week === null || p.week === weekType)
        .map(p => {
          const bell = BELLS.find(b => b.pair === p.pair) || { start: "??:??", end: "??:??" };
          return { ...p, start: bell.start, end: bell.end };
        })
        .sort((a, b) => a.pair - b.pair);

      if (searchQuery) {
        pairs = pairs.filter(p => p.name.toLowerCase().includes(searchQuery) || p.teacher.toLowerCase().includes(searchQuery) || p.room.toLowerCase().includes(searchQuery));
      }

      const container = document.getElementById('container');

      // Якщо на сьогодні пар немає (вихідний) — показуємо найближчий робочий день (Понеділок)
      if (pairs.length === 0) {
        let altHtml = '';
        if (!searchQuery && dayOffset === 0) {
          // Показуємо пари понеділка
          const monPairs = (SCHEDULE[0] || []).filter(p => p.week === null || p.week === weekType);
          altHtml = `
            <div class="day-section-title" style="margin-top: 24px;">📅 Розклад на Понеділок:</div>
            ${renderPairsListHtml(monPairs, 0, false)}
          `;
        }

        container.innerHTML = `
          <div class="apple-card empty-card">
            <div class="empty-icon">${searchQuery ? '🔍' : '🏖️'}</div>
            <div class="empty-title">${searchQuery ? 'Нічого не знайдено' : 'На цей день пар немає!'}</div>
            <div class="empty-desc">${searchQuery ? 'Спробуйте інший пошуковий запит' : (dayOffset === 0 ? 'Сьогодні вихідний, можна спокійно відпочивати.' : 'Завтра занять немає.')}</div>
          </div>
          ${altHtml}
        `;
        return;
      }

      container.innerHTML = renderPairsListHtml(pairs, dayIdx, dayOffset === 0);
    }

    function renderPairsListHtml(pairs, dayIdx, isToday) {
      const now = new Date();
      const nowMin = now.getHours() * 60 + now.getMinutes();

      let html = '';
      pairs.forEach(p => {
        const bell = BELLS.find(b => b.pair === p.pair) || { start: p.start || "??:??", end: p.end || "??:??" };
        const start = bell.start;
        const end = bell.end;

        const startMin = timeToMinutes(start);
        const endMin = timeToMinutes(end);
        const isCurrent = isToday && (nowMin >= startMin && nowMin <= endMin);
        const isPast = isToday && (nowMin > endMin);

        let progress = 0;
        let minLeft = 0;
        if (isCurrent) {
          progress = Math.min(100, Math.max(0, Math.floor(((nowMin - startMin) / (endMin - startMin)) * 100)));
          minLeft = Math.max(0, endMin - nowMin);
        }

        const memoKey = `memo_${p.name}_${p.pair}`;
        const savedMemo = safeGet(memoKey);

        html += `
          <div class="apple-card ${isCurrent ? 'live-card' : ''} ${isPast ? 'past-card' : ''}" onclick="openPairModal(${dayIdx}, ${p.pair})">
            <div class="pair-header">
              <span class="pair-time">${start} – ${end}</span>
              ${isCurrent ? 
                '<span class="live-badge"><span class="pulse-dot"></span>Зараз іде</span>' : 
                `<span class="pair-tag">Пара #${p.pair} • ${p.type}</span>`
              }
            </div>
            <div class="pair-title">${escapeHtml(p.name)}</div>
            <div class="pair-details">
              <div class="detail-item">
                <span class="icon-symbol">🚪</span>
                <span>${escapeHtml(p.room)}</span>
              </div>
              <div class="detail-item">
                <span class="icon-symbol">👨‍🏫</span>
                <span>${escapeHtml(p.teacher)}</span>
              </div>
            </div>

            ${savedMemo ? `
              <div class="memo-indicator">
                <span>📝</span> <span>${escapeHtml(savedMemo).substring(0, 35)}</span>
              </div>
            ` : ''}

            ${isCurrent ? `
              <div class="progress-wrapper">
                <div class="progress-bar-bg">
                  <div class="progress-bar-fill" style="width: ${progress}%;"></div>
                </div>
                <div class="progress-info">
                  <span>Пройшло ${progress}%</span>
                  <span>Залишилось ${minLeft} хв</span>
                </div>
              </div>
            ` : ''}
          </div>
        `;
      });

      return html;
    }

    function renderFullWeek(weekType, title) {
      document.getElementById('subtitle').innerText = `Повний розклад • ${title}`;
      const container = document.getElementById('container');
      let html = '';

      for (let day = 0; day < 6; day++) {
        let pairs = (SCHEDULE[day] || [])
          .filter(p => p.week === null || p.week === weekType)
          .map(p => {
            const bell = BELLS.find(b => b.pair === p.pair) || { start: "??:??", end: "??:??" };
            return { ...p, start: bell.start, end: bell.end };
          })
          .sort((a, b) => a.pair - b.pair);

        if (searchQuery) {
          pairs = pairs.filter(p => p.name.toLowerCase().includes(searchQuery) || p.teacher.toLowerCase().includes(searchQuery) || p.room.toLowerCase().includes(searchQuery));
          if (pairs.length === 0) continue;
        }

        html += `<div class="day-section-title">📅 ${DAYS_NAMES[day]}</div>`;

        if (pairs.length === 0) {
          html += `<div class="apple-card" style="padding: 14px 18px; color: var(--text-secondary); font-size: 14px;">Занять немає</div>`;
          continue;
        }

        html += renderPairsListHtml(pairs, day, false);
      }

      if (!html) {
        html = `
          <div class="apple-card empty-card">
            <div class="empty-icon">🔍</div>
            <div class="empty-title">Нічого не знайдено</div>
            <div class="empty-desc">Спробуйте інший пошуковий запит</div>
          </div>
        `;
      }

      container.innerHTML = html;
    }

    function renderBells() {
      document.getElementById('subtitle').innerText = 'Розклад дзвінків • ВСП ФК КрНУ';
      let items = BELLS.map(b => `
        <div class="bell-item">
          <div>
            <div style="font-weight: 700; font-size: 15px;">#${b.pair} пара</div>
            <div style="font-size: 12px; color: var(--text-secondary);">Перерва: ${b.breakTime}</div>
          </div>
          <div style="font-weight: 700; color: var(--accent-blue); font-size: 15px;">${b.start} – ${b.end}</div>
        </div>
      `).join('');

      document.getElementById('container').innerHTML = `
        <div class="apple-card">
          <div style="font-weight: 800; font-size: 17px; margin-bottom: 12px;">Сітка дзвінків</div>
          ${items}
        </div>
      `;
    }

    // --- ВІДКРИТТЯ МОДАЛКИ ПАРИ ЧЕРЕЗ ІНДЕКС (БЕЗ ПОМИЛОК ЛАПОК В ONCLICK) ---
    function openPairModal(dayIdx, pairNum) {
      haptic('medium');
      const dayPairs = SCHEDULE[dayIdx] || [];
      const p = dayPairs.find(item => item.pair === pairNum);
      if (!p) return;

      const bell = BELLS.find(b => b.pair === p.pair) || { start: "08:30", end: "10:00" };
      selectedPairForModal = { ...p, start: bell.start, end: bell.end };

      document.getElementById('sheet-pair-tag').innerText = `Пара #${p.pair} • ${p.type}`;
      document.getElementById('sheet-title').innerText = p.name;
      document.getElementById('sheet-time').innerText = `${bell.start} – ${bell.end}`;
      document.getElementById('sheet-room').innerText = p.room;
      document.getElementById('sheet-teacher').innerText = p.teacher;

      const memoKey = `memo_${p.name}_${p.pair}`;
      document.getElementById('sheet-memo').value = safeGet(memoKey, '');

      document.getElementById('sheet-overlay').classList.add('active');
      document.getElementById('bottom-sheet').classList.add('active');
    }

    function closeSheet() {
      haptic('light');
      document.getElementById('sheet-overlay').classList.remove('active');
      document.getElementById('bottom-sheet').classList.remove('active');
    }

    function saveMemo() {
      if (!selectedPairForModal) return;
      haptic('success');
      const memoKey = `memo_${selectedPairForModal.name}_${selectedPairForModal.pair}`;
      const val = document.getElementById('sheet-memo').value.trim();
      if (val) {
        safeSet(memoKey, val);
      } else {
        safeRemove(memoKey);
      }
      showToast('Нотатку збережено! 💾');
      closeSheet();
      render();
    }

    function copyPairInfo() {
      if (!selectedPairForModal) return;
      haptic('light');
      const text = `${selectedPairForModal.name}\nЧас: ${selectedPairForModal.start} - ${selectedPairForModal.end}\nАудиторія: ${selectedPairForModal.room}\nВикладач: ${selectedPairForModal.teacher}`;
      try {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(text);
        }
      } catch(e) {}
      showToast('Дані скопійовано! 📋');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // Ініціалізація теми
    const savedTheme = safeGet('km_theme', 'auto');
    setTheme(savedTheme);

    // Перший запуск рендеру
    render();

    // Оновлення таймера щосекунди
    setInterval(() => {
      const now = new Date();
      const currentWeek = getWeekType(now);
      updateSummaryWidget(now, currentWeek);
    }, 1000);
  </script>
